set-option -g prefix C-s
set -g mouse on
set -g set-clipboard on
setw -g mode-keys vi

set-option -g status-position top

# Split panes using | and - and keep current directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Open new windows in the same directory too
bind c new-window -c "#{pane_current_path}"

set -g @tmux_power_theme 'everforest'
set -g @tmux_power_time_format '%H:%M'
set -g @tmux_power_show_user    false
set -g @tmux_power_show_host    false
set -g @tmux_power_show_session true
set -g @tmux_power_g0 "#373737"

set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-power'

run '~/.tmux/plugins/tpm/tpm'
