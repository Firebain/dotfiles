[bar.default]
capsule = true
capsule_opacity = 0.7799999825656414
center = [ "clock", "weather" ]
end = [ "cpu", "ram", "privacy", "tray", "notifications", "screenshot", "volume", "control-center", "session" ]
margin_ends = 0
padding = 32
radius = 0
start = [ "launcher", "workspaces", "active_window" ]

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Samara"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-4" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-4"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
auto_update = "none"
enabled = []

[shell]
clipboard_enabled = false
lang = "en"
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false

[theme]
builtin = "Gruvbox"
community_palette = "Jiva"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "/home/firebain/Pictures/Wallpapers/anime.jpg"

[wallpaper.last]
path = "/home/firebain/Pictures/Wallpapers/anime.jpg"

[wallpaper.monitors.DP-4]
path = "/home/firebain/Pictures/Wallpapers/anime.jpg"

[widget.clock]
format = "{:%H:%M %D}"
